
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050619">
<title>Lumos IA — Galaxy Experience</title>

<style>
:root{
  --bg:#050619;
  --purple:#9b5cff;
  --blue:#258cff;
  --text:#f5f3ff;
  --muted:#a4a9d0;
  --line:#5550a055;
}
*{box-sizing:border-box}
body{
  margin:0;height:100vh;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:Inter,Segoe UI,system-ui,sans-serif;
}
button,textarea{font:inherit}
button{cursor:pointer}
.app{height:100vh;display:flex;position:relative;overflow:hidden}

/* GALAXY BACKGROUND */
.main{
  min-width:0;flex:1;display:flex;flex-direction:column;
  position:relative;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 105%,#123c9b77,transparent 48%),
    radial-gradient(ellipse at 12% 35%,#6018a955,transparent 38%),
    radial-gradient(ellipse at 85% 30%,#102c9d66,transparent 40%),
    linear-gradient(145deg,#050619,#080b2c 55%,#030718);
}
.main:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  opacity:.65;
  background-image:
    radial-gradient(2px 2px at 10% 20%,#fff,transparent),
    radial-gradient(1px 1px at 25% 65%,#b9a3ff,transparent),
    radial-gradient(2px 2px at 40% 12%,#fff,transparent),
    radial-gradient(1px 1px at 55% 40%,#fff,transparent),
    radial-gradient(2px 2px at 72% 15%,#b9caff,transparent),
    radial-gradient(1px 1px at 90% 65%,#fff,transparent),
    radial-gradient(2px 2px at 82% 85%,#a78bff,transparent),
    radial-gradient(1px 1px at 15% 90%,#fff,transparent);
  background-size:260px 230px;
}
.main:after{
  content:"";position:absolute;pointer-events:none;
  width:850px;height:850px;border-radius:50%;
  left:50%;bottom:-760px;transform:translateX(-50%);
  border:2px solid #397cff66;
  box-shadow:0 -10px 70px #246aff55,0 -35px 130px #5424ff33;
  background:linear-gradient(180deg,#183b9955,transparent 45%);
}

/* SIDEBAR */
.sidebar{
  width:300px;flex-shrink:0;z-index:5;
  display:flex;flex-direction:column;
  padding:25px 20px;
  background:linear-gradient(180deg,#070b22f5,#09091ff5);
  border-right:1px solid #7464ff66;
  box-shadow:8px 0 50px #0007;
  transition:width .3s,padding .3s;
  overflow:hidden;
}
.sidebar.collapsed{width:0;padding:0;border:0}
.brand{display:flex;align-items:center;gap:13px;margin-bottom:35px;white-space:nowrap}
.logo{
  width:54px;height:54px;display:grid;place-items:center;
  font-size:37px;color:white;flex-shrink:0;
  background:radial-gradient(circle,#a9baff,#6635ff 55%,#180d56);
  border:1px solid #a98cff;
  border-radius:18px;
  box-shadow:0 0 25px #784bff,0 0 55px #385dff55;
  text-shadow:0 0 15px white;
}
.brand h1{margin:0;font-size:23px;letter-spacing:.3px}
.brand h1 span{color:#a978ff}
.brand p{margin:4px 0 0;color:#aaa6d8;font-size:11px}
.new-chat{
  padding:15px 13px;border:1px solid #a56cff;
  border-radius:13px;color:white;text-align:left;
  background:linear-gradient(110deg,#7028e9,#253ed0);
  box-shadow:0 0 25px #713cff55;
  white-space:nowrap;transition:.2s;
}
.new-chat:hover{transform:translateY(-2px);box-shadow:0 0 35px #8e54ff88}
.side-label{
  margin:32px 8px 14px;color:#8e91c2;
  font-size:11px;letter-spacing:1.7px;text-transform:uppercase;
  white-space:nowrap;
}
#chatList{flex:1;overflow-y:auto;min-height:0}
.chat-item{
  width:100%;padding:13px 11px;margin-bottom:5px;
  border:1px solid transparent;border-radius:11px;
  background:transparent;color:#c6c8e9;
  text-align:left;font-size:12px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.chat-item:hover,.chat-item.active{
  background:linear-gradient(100deg,#6531b755,#173d8955);
  border-color:#8464ff77;color:white;
}
.sidebar-footer{
  border:1px solid #6350bd55;border-radius:15px;
  padding:15px 12px;color:#c6baff;
  background:linear-gradient(120deg,#25165b88,#101d4c88);
  font-size:12px;white-space:nowrap;
}

/* TOP BAR */
.topbar{
  height:70px;flex-shrink:0;z-index:2;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;border-bottom:1px solid #ffffff12;
  background:#080b23aa;backdrop-filter:blur(18px);
}
.top-left{display:flex;align-items:center;gap:15px}
.menu{
  width:41px;height:41px;border-radius:12px;
  border:1px solid #6e65b966;background:#14183b;
  color:white;font-size:19px;
}
.menu:hover{background:#302267}
.top-title{font-size:13px;color:#d8d7ff}
.status{
  display:flex;align-items:center;gap:8px;
  padding:9px 14px;border-radius:30px;
  border:1px solid #36b78a55;background:#103c3444;
  color:#8fffd0;font-size:11px;
}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:#3cffad;box-shadow:0 0 12px #3cffad;
}

/* CHAT AREA */
#messages{
  flex:1;min-height:0;overflow-y:auto;
  position:relative;z-index:1;
  padding:30px 22px;
  display:flex;flex-direction:column;gap:22px;
  scroll-behavior:smooth;
}
.welcome{
  margin:auto;width:min(850px,100%);
  text-align:center;padding:20px;
  animation:appear .8s ease;
}
@keyframes appear{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:translateY(0)}
}
.welcome-icon{
  width:112px;height:112px;margin:0 auto 18px;
  display:grid;place-items:center;border-radius:50%;
  font-size:69px;color:white;
  background:radial-gradient(circle at 35% 25%,#e3dcff,#8552ff 35%,#152a9d 75%);
  border:1px solid #b9a0ff;
  box-shadow:0 0 25px #9055ff,0 0 65px #473cff77,inset 0 0 25px #ffffff55;
  animation:float 4s ease-in-out infinite;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-9px)}
}
.welcome h2{
  font-size:48px;letter-spacing:-2px;margin:0 0 8px;
  text-shadow:0 0 30px #765cff66;
}
.welcome h2 span{
  background:linear-gradient(90deg,#c69aff,#6dbbff);
  color:transparent;background-clip:text;
}
.welcome-subtitle{
  font-size:19px!important;color:#e2dcff!important;
  margin:0 0 12px!important;
}
.welcome p{
  color:#b4b8dc;font-size:14px;line-height:1.8;
  margin:0 0 30px;
}
.chips{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;text-align:left;
}
.chip{
  min-height:120px;padding:17px 15px;
  border:1px solid #7065d888;border-radius:18px;
  background:linear-gradient(145deg,#171b46dd,#090e2cdd);
  color:#e6e3ff;text-align:left;font-size:13px;
  box-shadow:inset 0 1px 15px #ffffff08,0 8px 25px #0005;
  transition:.25s;
}
.chip span{display:block;font-size:25px;margin-bottom:13px}
.chip:hover{
  transform:translateY(-5px);
  border-color:#a47aff;
  box-shadow:0 0 25px #7952ff66,inset 0 0 20px #6842ff22;
  background:linear-gradient(145deg,#302064,#10285b);
}

/* MESSAGES */
.msg{
  max-width:min(76%,760px);padding:15px 19px;
  border-radius:18px;white-space:pre-wrap;
  overflow-wrap:anywhere;font-size:14px;line-height:1.75;
  animation:appear .3s ease;
}
.user{
  align-self:flex-end;
  background:linear-gradient(125deg,#783ce0,#236fd1);
  border:1px solid #b59aff66;border-bottom-right-radius:5px;
  box-shadow:0 0 25px #563aff33;
}
.assistant{
  align-self:flex-start;
  background:linear-gradient(135deg,#171c43ee,#101b39ee);
  border:1px solid #7166bd77;border-bottom-left-radius:5px;
  box-shadow:0 0 20px #244b9b22;
}
.typing{
  z-index:2;padding:0 28px 12px;
  color:#bba0ff;font-size:12px;
}

/* INPUT */
.input-area{z-index:2;padding:12px 24px 7px}
.input-box{
  width:min(850px,100%);margin:auto;
  display:flex;align-items:flex-end;gap:10px;
  padding:10px 12px;border-radius:25px;
  border:1px solid #9272ff;
  background:linear-gradient(120deg,#15183bee,#101b3bee);
  box-shadow:0 0 25px #7552ff33,0 0 55px #276aff1a;
  backdrop-filter:blur(20px);transition:.25s;
}
.input-box:focus-within{
  border-color:#bca0ff;
  box-shadow:0 0 0 3px #9874ff22,0 0 35px #8154ff55;
}
textarea{
  flex:1;min-width:0;resize:none;min-height:43px;max-height:140px;
  background:transparent;border:0;outline:0;
  color:white;padding:11px 12px;font-size:14px;
}
textarea::placeholder{color:#999dc4}
.send{
  width:47px;height:47px;flex-shrink:0;
  border:1px solid #c0a2ff;border-radius:16px;
  color:white;font-size:22px;
  background:linear-gradient(135deg,#a14cff,#356fff);
  box-shadow:0 0 22px #8050ff88;transition:.2s;
}
.send:hover{transform:scale(1.07);box-shadow:0 0 32px #a06aff}
.send:disabled{opacity:.5;cursor:not-allowed}
.disclaimer{
  z-index:2;padding:8px 10px 13px;
  text-align:center;color:#888bb6;font-size:10px;
}

/* SCROLLBAR */
#messages::-webkit-scrollbar,#chatList::-webkit-scrollbar{width:5px}
#messages::-webkit-scrollbar-thumb,#chatList::-webkit-scrollbar-thumb{
  background:#6454b9;border-radius:10px;
}

/* MOBILE */
@media(max-width:850px){
  .sidebar{
    position:absolute;left:0;top:0;bottom:0;
    width:290px;box-shadow:15px 0 55px #000b;
  }
  .sidebar.collapsed{width:0}
  .welcome h2{font-size:36px}
  .chips{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:520px){
  .topbar{height:59px;padding:0 12px}
  .top-title{font-size:11px}
  #messages{padding:16px 11px}
  .welcome{padding:12px 2px}
  .welcome-icon{width:83px;height:83px;font-size:53px}
  .welcome h2{font-size:29px;letter-spacing:-1px}
  .welcome-subtitle{font-size:15px!important}
  .welcome p{font-size:12px}
  .chips{grid-template-columns:1fr;gap:9px}
  .chip{min-height:68px;padding:12px}
  .chip span{display:inline;margin-right:8px;font-size:19px}
  .msg{max-width:94%;font-size:13px}
  .input-area{padding:9px 10px 4px}
  .disclaimer{font-size:9px}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="logo">✦</div>
    <div>
      <h1>Lumos <span>IA</span></h1>
      <p>LA TUA INTELLIGENZA ARTIFICIALE</p>
    </div>
  </div>

  <button class="new-chat" id="newChat">＋ &nbsp; Nuova conversazione</button>

  <div class="side-label">Conversazioni recenti</div>
  <div id="chatList"></div>

  <div class="sidebar-footer">✦ &nbsp; Lumos IA<br><small>Il tuo universo intelligente</small></div>
</aside>

<main class="main">
  <header class="topbar">
    <div class="top-left">
      <button class="menu" id="menu" aria-label="Apri menu">☰</button>
      <div class="top-title">✦ &nbsp; Il tuo assistente intelligente</div>
    </div>
    <div class="status"><span class="dot"></span> Online</div>
  </header>

  <section id="messages" aria-live="polite"></section>

  <div class="typing" id="typing" hidden>✦ Lumos IA sta elaborando la risposta...</div>

  <div class="input-area">
    <form class="input-box" id="form">
      <textarea id="prompt" rows="1"
        placeholder="Scrivi il tuo messaggio..."
        aria-label="Messaggio" required></textarea>
      <button class="send" id="send" type="submit">➤</button>
    </form>
  </div>
  <div class="disclaimer">Lumos IA può commettere errori: verifica le informazioni importanti.</div>
</main>
</div>

<script>
const form=document.querySelector('#form');
const input=document.querySelector('#prompt');
const messages=document.querySelector('#messages');
const send=document.querySelector('#send');
const typing=document.querySelector('#typing');
const chatList=document.querySelector('#chatList');
const sidebar=document.querySelector('#sidebar');

let history=[];
let conversations=[];
let activeId=null;

function saveChats(){
  localStorage.setItem('lumos_chats',JSON.stringify(conversations));
}

function renderList(){
  chatList.innerHTML='';
  conversations.slice().reverse().forEach(chat=>{
    const button=document.createElement('button');
    button.className='chat-item'+(chat.id===activeId?' active':'');
    button.textContent='✧  '+chat.title;
    button.onclick=()=>loadChat(chat.id);
    chatList.appendChild(button);
  });
}

function welcomeScreen(){
  messages.innerHTML=`
    <div class="welcome" id="welcome">
      <div class="welcome-icon">✦</div>
      <h2>Lumos <span>IA</span></h2>
      <p class="welcome-subtitle">Le tue idee. Il nostro futuro.</p>
      <p>Sono qui per aiutarti, rispondere alle tue domande<br>
      e darti il supporto di cui hai bisogno.</p>
      <div class="chips">
        <button class="chip"><span>📚</span>Spiegami il present simple</button>
        <button class="chip"><span>💡</span>Dammi un'idea per un progetto</button>
        <button class="chip"><span>🤖</span>Come funziona l'intelligenza artificiale?</button>
        <button class="chip"><span>✍️</span>Aiutami a scrivere un testo</button>
      </div>
    </div>`;
}

function newChat(){
  if(send.disabled)return;
  activeId=null;
  history=[];
  welcomeScreen();
  renderList();
  input.focus();
}

function loadChat(id){
  if(send.disabled)return;
  const chat=conversations.find(c=>c.id===id);
  if(!chat)return;
  activeId=id;
  history=chat.messages.map(m=>({...m}));
  messages.innerHTML='';
  history.forEach(m=>bubble(m.content,m.role));
  renderList();
}

function bubble(text,role){
  const el=document.createElement('div');
  el.className='msg '+(role==='user'?'user':'assistant');
  el.textContent=text;
  messages.appendChild(el);
  messages.scrollTop=messages.scrollHeight;
}

async function submit(text){
  text=text.trim();
  if(!text||send.disabled)return;

  if(!activeId)activeId=Date.now().toString();

  const wasEmpty=history.length===0;
  bubble(text,'user');
  history.push({role:'user',content:text});

  if(wasEmpty){
    conversations.push({
      id:activeId,
      title:text.slice(0,35),
      messages:history
    });
  }else{
    const chat=conversations.find(c=>c.id===activeId);
    if(chat)chat.messages=history;
  }

  input.value='';
  input.style.height='auto';
  send.disabled=true;
  typing.hidden=false;

  try{
    const response=await fetch('/api/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({messages:history.slice(-12)})
    });

    const data=await response.json();
    if(!response.ok)throw new Error(data.error||'Errore del server');

    const answer=data.reply||'Non ho ricevuto una risposta.';
    history.push({role:'assistant',content:answer});
    bubble(answer,'assistant');

    const chat=conversations.find(c=>c.id===activeId);
    if(chat)chat.messages=history;

    saveChats();
    renderList();

  }catch(err){
    bubble('Mi dispiace, c’è stato un problema: '+err.message,'assistant');
    history.pop();
    const chat=conversations.find(c=>c.id===activeId);
    if(chat)chat.messages=history;
  }finally{
    typing.hidden=true;
    send.disabled=false;
    input.focus();
  }
}

document.querySelector('#newChat').onclick=newChat;
document.querySelector('#menu').onclick=()=>{
  sidebar.classList.toggle('collapsed');
};

form.addEventListener('submit',e=>{
  e.preventDefault();
  submit(input.value);
});

input.addEventListener('input',()=>{
  input.style.height='auto';
  input.style.height=Math.min(input.scrollHeight,140)+'px';
});

input.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    form.requestSubmit();
  }
});

messages.addEventListener('click',e=>{
  const chip=e.target.closest('.chip');
  if(chip){
    const text=chip.textContent.trim();
    submit(text);
  }
});

try{
  conversations=JSON.parse(localStorage.getItem('lumos_chats')||'[]');
  if(!Array.isArray(conversations))conversations=[];
}catch(e){
  conversations=[];
}
renderList();
welcomeScreen();
</script>
</body>
</html>
